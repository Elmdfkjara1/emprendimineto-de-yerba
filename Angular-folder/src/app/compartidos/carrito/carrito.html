<div class="carrito-container">

  <h2>Carrito de compras</h2>

  <table class="tabla-carrito">

    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
        <th>Acciones</th>
      </tr>
    </thead>


    <tbody>
      @for (p of productosCarrito; track $index) {
        <tr>
          <td>{{ p.nombre }}</td>
          <td>${{ p.precio }}</td>
          <td>{{ p.cantidad ?? 1 }}</td>
          <td>${{ p.precio * (p.cantidad ?? 1) }}</td>
          <td>
            <button type="button" (click)="eliminarDelCarrito($index)">Eliminar</button>
          </td>
        </tr>
      } @empty {
      <tr>
        <td colspan="5" class="text-center">
          Tu carrito está vacío
        </td>
      </tr>
      }
    </tbody>

    <tfoot>
      <tr>
        <th colspan="3">Precio total</th>
        <th colspan="2">${{ precioTotal }}</th>
      </tr>
    </tfoot>
  </table>
