<section>
    <h1>Inicio de sesión</h1>
    <img src="assets/logo-o.png" alt="Imagen de inicio de sesión" width="100" height="100">
    <form (ngSubmit)="ingresar()">
        <!-- Campo donde el usuario ingresa su correo electrónico. --><!-- [(ngModel)]="email" vincula el valor del campo con lavariable email del componente TypeScript. --><input
            [(ngModel)]="email" name="email" type="email" required autocomplete="email"
            placeholder="Email"><!-- Campo donde el usuario ingresa su contraseña. --><!-- [(ngModel)]="contraseña" vincula el valor ingresado conla variable contraseña del componente. --><!-- type="password" oculta los caracteres de la contraseña. --><input
            [(ngModel)]="password" name="password" type="password" required autocomplete="current-password"
            placeholder="Contraseña"><!-- Al hacer clic en el botón, se ejecuta el método ingresar()definido en inicio-sesion.component.ts. --><button
            type="submit">Ingresar</button><!-- @if comprueba si la variable error tiene contenido.Si contiene un mensaje, se muestra el párrafo siguiente. -->
        @if(error){<!-- Muestra el mensaje de error guardado en la variable error.La clase CSS error permite aplicar estilos al mensaje. -->
        <p class="error">{{ error }}</p>
        }
            <button type="button" routerLink="/registro">Registrarse</button>
    </form>
</section>
