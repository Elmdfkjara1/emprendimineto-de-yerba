<section class="producto-seccion py-5">
  <div class="container">
    <div class="row g-5 align-items-center">

      <!-- Columna imagen -->
      <div class="col-12 col-lg-6">
        <div class="producto-img-hueco rounded-4 shadow-sm mx-auto">
          <img [src]="producto.imagen" [alt]="producto.nombre" class="producto-img rounded-4" loading="lazy">
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
          <span class="badge-ambiente">100% Natural</span>
          <span class="badge-ambiente">Origen Misiones</span>
          <span class="badge-ambiente">Producción Limitada</span>
        </div>
      </div>

      <!-- Columna info del producto -->
      <div class="col-12 col-lg-6">
        <p class="text-uppercase eyebrow mb-2">Edición única</p>
        <h1 class="producto-titulo mb-3">{{ producto.nombre }}</h1>
        <p class="producto-descripcion mb-4">
          Yerba mate de estacionamiento natural, cosechada y secada de forma artesanal.
          Sabor suave, aroma a monte y hoja verde.
        </p>

        <!-- Selector de variante -->
        <div class="mb-4">
          <span class="fw-semibold d-block mb-2">Elegí el formato</span>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn-variante" [class.activa]="producto.id === 1"
              [attr.aria-pressed]="producto.id === 1" (click)="seleccionarProducto(1)">
              <span class="d-block fw-semibold">{{ productos[0].nombre }}</span>
              <span class="d-block small">${{ productos[0].precio }}</span>
            </button>
            <button type="button" class="btn-variante" [class.activa]="producto.id === 2"
              [attr.aria-pressed]="producto.id === 2" (click)="seleccionarProducto(2)">
              <span class="d-block fw-semibold">{{ productos[1].nombre }}</span>
              <span class="d-block small">${{ productos[1].precio }}</span>
            </button>
          </div>
        </div>

        <!-- Cantidad + precio -->
        <div class="row g-3 align-items-center mb-4">
          <div class="col-auto">
            <div class="selector-cantidad d-flex align-items-center">
              <button type="button" class="btn-cantidad" (click)="disminuirCantidad()"
                [disabled]="cantidad === 1" aria-label="Disminuir cantidad">−</button>
              <span class="cantidad-valor px-3">{{ cantidad }}</span>
              <button type="button" class="btn-cantidad" (click)="aumentarCantidad()"
                aria-label="Aumentar cantidad">+</button>
            </div>
          </div>
          <div class="col">
            <p class="mb-0 text-muted small">Precio total: </p>
            <p class="mb-0 producto-precio">${{ producto.precio * cantidad }}</p>
          </div>
        </div>


        <!-- CTA -->
        <div class="d-grid d-sm-flex gap-3">
          <button type="button" class="btn-comprar flex-sm-fill" (click)="agregarAlCarrito(producto)">
            Agregar al carrito
          </button>
          <button type="button" class="btn-consultar" [routerLink]="['/contacto']">
            Consultar por mayor
          </button>
        </div>
      </div>

    </div>
  </div>
</section>
