<section class="producto-seccion py-5">
  <div class="container">
    <div class="row g-5 align-items-center">

      <!-- Columna imagen -->
      <div class="col-12 col-lg-6">
        <div class="producto-img-hueco rounded-4 shadow-sm mx-auto">
          <img src="assets/yerba2k.jpg" alt="Paquete de Yerba Ojas" class="producto-img rounded-4" loading="lazy">
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
          <span class="badge-ambiente">100% Natural</span>
          <span class="badge-ambiente">Origen Misiones</span>
          <span class="badge-ambiente">Producción Limitada</span>
        </div>
      </div>

      <!-- Columna info del producto -->
      <div class="col-12 col-lg-6">
        <p class="text-uppercase eyebrow mb-2">Edición única</p>
        <h1 class="producto-titulo mb-3">Yerba Ojas</h1>
        <p class="producto-descripcion mb-4">
          Yerba mate de estacionamiento natural, cosechada y secada de forma artesanal.
          Sabor suave, aroma a monte y hoja verde.
        </p>

        <!-- Selector de variante -->
        <div class="mb-4">
          <span class="fw-semibold d-block mb-2">Elegí el formato</span>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn-variante activa">
              <span class="d-block fw-semibold">1 Kg</span>
              <span class="d-block small">$10.000</span>
            </button>
            <button type="button" class="btn-variante">
              <span class="d-block fw-semibold">2 Kg</span>
              <span class="d-block small">$20.000</span>
            </button>
          </div>
        </div>

        <!-- Cantidad + precio -->
        <div class="row g-3 align-items-center mb-4">
          <div class="col-auto">
            <div class="selector-cantidad d-flex align-items-center">
              <button type="button" class="btn-cantidad">−</button>
              <span class="cantidad-valor px-3">1</span>
              <button type="button" class="btn-cantidad">+</button>
            </div>
          </div>
          <div class="col">
            <p class="mb-0 text-muted small">Precio total: </p>
            <p class="mb-0 producto-precio">$10.000</p>
          </div>
        </div>


        <!-- CTA -->
        <div class="d-grid d-sm-flex gap-3">
          <button type="button" class="btn-comprar flex-sm-fill">
            Agregar al carrito
          </button>
          <button type="button" class="btn-consultar" href="contacto">
            Consultar por mayor
          </button>
        </div>
      </div>

    </div>
  </div>
</section>
